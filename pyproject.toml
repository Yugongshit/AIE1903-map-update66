[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-map-update"
version = "0.1.0"
description = "Evidence-based shared road map maintenance research prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
argoverse = ["numpy>=1.26,<3"]

[project.scripts]
map-update = "map_update.cli:main"

[tool.setuptools.packages.find]
include = ["map_update*"]

[tool.setuptools.package-data]
map_update = ["*.html", "*.css", "*.js", "*.tsv"]
