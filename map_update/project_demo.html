<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享地图维护 · 项目演示</title>
<style>

px}.layout{grid-template-columns:1fr;margin:0 18px 18px}#map{height:360px}.steps{grid-template-columns:repeat(3,1fr)}footer{margin:0 18px 18px}h1{font-size:23px}}
</style></head><body>
<header><div><div class="eyebrow">课程项目 · 共享道路地图维护</div><h1>从观测证据，到可追溯的地图更新</h1><div class="sub">真实场景查看现状 · 受控复访演示判断 · 版本历史验证回退</div></div><nav class="tabs" aria-label="演示模式"><button id="real-tab" class="on">① 真实场景回放</button><button id="sim-tab">② 模拟复访与更新</button></nav></header>
<div id="notice" class="notice"></div><div id="stats" class="stats"></div>
<main class="layout"><section><div class="panel"><div class="head"><div><h2 id="map-title"></h2><div id="map-sub" class="small"></div></div><button id="fit">重置视图</button></div><div class="tools"><label><input id="base-layer" type="checkbox" checked> 参考地图</label><label><input id="obs-layer" type="checkbox" checked> 观测 / 事件</label><label id="follow-label"><input id="follow" type="checkbox" checked> 跟随自车</label><div class="legend"><span><i class="dot" style="background:var(--mint)"></i><span id="legend-base">参考标线</span></span><span><i class="dot" style="background:var(--gold)"></i>观测标线</span><span><i class="dot" style="background:var(--coral)"></i>占用 / 被拒观测</span></div></div>
<div class="canvas-wrap"><svg id="map" role="img" aria-label="道路地图与观测示意"><g id="drawing"></g></svg><div class="overlay" id="map-hint"></div></div>
<div class="controls"><div id="real-controls"><div class="row"><h3 id="frame-title"></h3><div><button id="prev">上一帧</button> <button id="play">播放</button> <button id="next">下一帧</button></div></div><input id="frame" type="range" min="0" max="40" value="0" aria-label="原始数据帧"><div class="row small"><span>0 秒</span><span id="clock"></span><span>19.85 秒</span></div></div><div id="sim-controls" class="hidden"><div class="row"><h3>按时间推进，观察决策与地图版本</h3><button id="auto">自动演示</button></div><div id="steps" class="steps"></div></div><div id="story" class="story"></div></div></div>
<div class="panel gap"><div class="head"><h2 id="history-title">当前能验证什么</h2><button id="export">导出当前证据</button></div><div id="history" class="history"></div></div></section>
<aside><div class="panel"><div class="head"><h2 id="side-title">候选证据</h2><span id="mode-badge" class="badge">真实数据</span></div><div class="aside-body"><div id="real-select"><select id="candidate" aria-label="选择本帧候选"></select></div><div id="cases" class="hidden"></div><div id="detail" class="detail"></div></div></div><div class="panel gap"><div class="head"><h2>地图写入检查</h2></div><div id="gates" class="aside-body"></div></div></aside></main>
<footer>此演示验证数据接入与程序逻辑。模拟可靠性输入、访问时间和变化由样例构造；规划模块尚无交付结果，本页不绘制规划路线。全片段候选评分仅用于离线分析。</footer>
<script id="payload" type="application/json">__DEMO_JSON__</script><script>
'use strict';

let mode='real',frame=0,stage=0,caseIndex=0,candidate=null,timer=null;
const cases=['标线位置变化','道路占用','类型未确认的标线差异','对齐异常的观测'];
const states={insufficient_evidence:'证据不足',temporary:'临时事件层',long_term_candidate:'持续性门槛通过，写入受阻',applied:'已更新基础地图',resolved:'已确认恢复',review_required:'需要重新核验'};

function el(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}
function geom(g,color,width=1.5,fill='none',dash=''){const rings=g.type==='Polygon'?g.coordinates:[g.coordinates];const d=rings.map(r=>r.map((p,i)=>`${i?'L':'M'}${p[0]},${-p[1]}`).join(' ')+(g.type==='Polygon'?' Z':'')).join(' ');const e=el('path',{d,stroke:color,fill,'stroke-width':width,'vector-effect':'non-scaling-stroke','fill-rule':'evenodd'});if(dash)e.setAttribute('stroke-dasharray',dash);$('drawing').append(e);return e;}
function circ(x,y,r,fill){$('drawing').append(el('circle',{cx:x,cy:-y,r,fill}));}
function stat(values){$('stats').replaceChildren();for(const[v,l]of values){const x=document.createElement('div');x.className='stat';const a=document.createElement('strong'),b=document.createElement('span');a.textContent=v;b.textContent=l;x.append(a,b);$('stats').append(x);}}
function details(values){$('detail').replaceChildren();const dl=document.createElement('dl');for(const[k,v]of values){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dl.append(dt,dd);}$('detail').append(dl);}
function gateRows(values){$('gates').replaceChildren();for(const[status,label]of values){const x=document.createElement('div');x.className='gate '+status;x.textContent=(status==='good'?'✓ ':status==='bad'?'× ':'○ ')+label;$('gates').append(x);}}
function fit(){if(mode==='real'){const f=D.actual.replay[frame];if($('follow').checked){const h=88,w=h*$('map').clientWidth/$('map').clientHeight;$('map').setAttribute('viewBox',`${f.ego.xy[0]-w/2} ${-f.ego.xy[1]-h/2} ${w} ${h}`);}else{const[x,y,x1,y1]=D.actual.reference_map.bounds_xyxy;$('map').setAttribute('viewBox',`${x} ${-y1} ${x1-x} ${y1-y}`);}}else $('map').setAttribute('viewBox','-3 -4 51 19');}
function real(){const a=D.actual,f=a.replay[frame];stat([[a.reference_map.elements.length,'局部地图要素'],[a.candidates.length,'全片段候选'],[1,'实际采集访问'],[0,'基础地图更新']]);$('map-title').textContent='真实场景 · 参考地图与逐帧观测';$('map-sub').textContent='第0980号场景 · 米制坐标 · 北向上';$('map-hint').textContent='标注车辆与占用轮廓 + 相机观测标线';$('map-title').dataset.mode='real';$('story').textContent='当前能展示道路观测与地图差异。缺少可靠性、独立复访和确定修改目标时，系统保留候选，不自动改写基础地图。';$('history-title').textContent='当前能验证什么';$('history').textContent=`${a.replay.length}帧已对齐，${a.summary.frame_line_observations}条有序观测标线、${a.summary.occupancy_frame_events}条占用帧记录。全窗口分数不等于真实概率；本帧缺测不代表道路已经恢复。`;
$('drawing').replaceChildren();if($('base-layer').checked)for(const e of a.reference_map.elements){const l=e.layer;let color='#3e6373',fill='none',w=.8;if(l==='road_segment')fill='#17323e';if(l==='lane')fill='#1d4050';if(l==='lane_connector')fill='#183a48';if(l==='ped_crossing')fill='#304450';if(l==='lane_divider'){color='#65e0bd';w=2;}if(l==='road_divider'){color='#b2c4cf';w=1.7;}geom(e.geometry_city,color,w,fill).dataset.layer='reference';}
if($('obs-layer').checked){for(const l of f.observed_lines)geom(l.geometry_city,'#ffd082',3).dataset.layer='observed';for(const o of f.occupancy)for(const obj of o.objects)geom(obj.geometry_city,'#ff9a8e',1.4,'#864b4e').dataset.layer='occupancy';for(const v of f.vehicles)circ(...v.xy,.6,'#84b7ff');circ(...f.ego.xy,1.1,'#65e0bd');const angle=f.ego.yaw_deg*Math.PI/180;geom({type:'LineString',coordinates:[f.ego.xy,[f.ego.xy[0]+4*Math.cos(angle),f.ego.xy[1]+4*Math.sin(angle)]]},'#65e0bd',3);}
fit();$('frame').value=frame;$('frame-title').textContent=`第 ${frame} / 40 帧 · ${f.elapsed_s.toFixed(2)} 秒`;$('clock').textContent='一次经过中的连续帧';const list=a.candidates.filter(c=>f.candidate_ids.includes(c.candidate_id));if(!list.some(c=>c.candidate_id===candidate))candidate=list[0]?.candidate_id||null;$('candidate').replaceChildren();for(const c of list){const op=document.createElement('option');op.value=c.candidate_id;op.textContent=c.candidate_id+' · '+(c.change_type==='occupancy'?'道路占用':'标线差异');$('candidate').append(op);}if(candidate)$('candidate').value=candidate;const c=list.find(c=>c.candidate_id===candidate);details(c?[['候选编号',c.candidate_id],['候选窗口分数（非概率）',c.evidence_score.toFixed(2)],['本帧观测',f.candidate_ids.includes(c.candidate_id)?'存在':'缺测不代表恢复'],['长期性判断','证据不足'],['地图对象',c.map_element_id||'标线修改目标尚未确认'],['数据来源','实际场景；车辆几何来自数据集标注']]:[['本帧状态','没有候选观测；不能据此认为变化消失']]);gateRows([['good','原始地图、时间与逐帧几何已接入'],['warn','可靠性与有效覆盖：未提供'],['warn','独立复访：只有一次经过'],['warn','历史地图角色与标线目标待确认'],['bad','当前不具备基础地图写入条件']]);}
function sim(){const s=D.stages[stage],b=s.bundle,e=b.events[caseIndex];const changes=b.current_map.elements.filter(x=>JSON.stringify(x)!==JSON.stringify(b.baseline.elements.find(y=>y.element_id===x.element_id))).length;stat([[new Set(b.evidence.map(x=>x.visit_id)).size,'模拟采集访问'],[stage===0?0:Math.floor(s.hour),'模拟时间跨度（小时）'],[changes,'当前生效的地图改动'],[b.versions.length,'保留的地图版本']]);$('map-title').textContent='受控示例 · 临时事件与基础地图分层';$('map-sub').textContent='四条初始标线 · 所有输入均为合成样例 · 米制几何';$('map-title').dataset.mode='sim';$('map-hint').textContent='灰色虚线：初始位置；绿色：当前地图；黄色：观测';$('story').textContent=s.description;$('history-title').textContent='实际引擎输出的地图版本';$('history').textContent=b.versions.map((v,i)=>`${i+1}. ${v.version} — ${v.patch?(v.patch.operation==='rollback'?'回退并保留历史':'依据支持观测更新标线'):'初始地图'}`).join('  →  ');
$('drawing').replaceChildren();geom({type:'Polygon',coordinates:[[[0,0],[10.5,0],[10.5,45],[0,45],[0,0]]]},'#34586b',.7,'#183b48');if($('base-layer').checked){for(const x of b.baseline.elements)geom(x.geometry_city,'#b2bdc9',1.6,'none','5 6').dataset.layer='baseline';for(const x of b.current_map.elements)if(x.active)geom(x.geometry_city,'#65e0bd',x.element_id==='line-1'?3.5:2).dataset.layer='current';}
if($('obs-layer').checked&&stage>0){const last=new Map();for(const r of b.evidence)last.set(r.change_id,r);for(const r of last.values()){if(!r.geometry_city)continue;const ev=b.events.find(x=>x.change_ids.includes(r.change_id));if(r.change_type==='occupancy'&&ev?.status==='resolved')continue;geom(r.geometry_city,r.reliability?.alignment_valid?'#ffd082':'#ff9a8e',2,r.change_type==='occupancy'?'#785638':'none',r.reliability?.alignment_valid?'':'3 4').dataset.layer='evidence';}}
fit();for(const btn of $('steps').children)btn.classList.toggle('on',+btn.dataset.stage===stage);for(const btn of $('cases').children)btn.classList.toggle('on',+btn.dataset.case===caseIndex);
if(!e){details([['当前案例',cases[caseIndex]],['状态','等待首次观测']]);gateRows([['warn','尚无支持证据'],['warn','地图保持初始版本']]);return;}
const audit=b.audit.filter(x=>x.event_id===e.event_id),accepted=audit.filter(x=>x.accepted).length;details([['当前案例',cases[caseIndex]],['状态',states[e.status]||e.status],['有效支持访问',e.independent_visits+' 次'],['有效支持跨度',(e.span_s/3600).toFixed(2)+' 小时'],['判定原因',reasons[e.reason]||e.reason],['质量检查',accepted+' 条接受 / '+(audit.length-accepted)+' 条拒绝'],['证据来源','合成输入；可靠性字段由样例提供']]);
gateRows([[accepted?'good':'bad',accepted?'质量门槛：有合格观测':'质量门槛：尚无合格观测'],[e.independent_visits>=b.policy.min_visits?'good':'warn',`有效支持访问 ${e.independent_visits} / ${b.policy.min_visits}`],[e.span_s>=b.policy.min_span_s?'good':'warn',`支持跨度 ${(e.span_s/3600).toFixed(2)} / ${b.policy.min_span_s/3600} 小时`],[e.status==='applied'?'good':'warn',e.status==='applied'?'基础地图：已写入':e.status==='temporary'?'基础地图：占用只进入事件层':e.status==='resolved'?'事件：明确恢复后解除':'基础地图：未写入或需复核']]);}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='播放';$('auto').textContent='自动演示';}
function render(){const isReal=mode==='real';$('drawing').setAttribute('transform',isReal?'':'rotate(90)');$('real-tab').classList.toggle('on',isReal);$('sim-tab').classList.toggle('on',!isReal);for(const id of ['real-controls','real-select','follow-label'])$(id).classList.toggle('hidden',!isReal);for(const id of ['sim-controls','cases'])$(id).classList.toggle('hidden',isReal);$('notice').classList.toggle('sim',!isReal);$('notice').textContent=isReal?'真实数据：41帧，约20秒，只有一次经过。当前基础地图更新为0，展示的是候选证据。':'受控模拟：用于检查程序逻辑。三次访问、24小时时间跨度等是演示规则，不是已验证的永久变化标准。';$('mode-badge').textContent=isReal?'真实数据':'受控模拟';$('side-title').textContent=isReal?'本帧候选证据':'四种处理情况';$('legend-base').textContent=isReal?'参考标线':'当前标线';isReal?real():sim();}
function setMode(m){stop();mode=m;render();}$('real-tab').onclick=()=>setMode('real');$('sim-tab').onclick=()=>setMode('sim');$('frame').oninput=e=>{stop();frame=+e.target.value;render();};$('prev').onclick=()=>{stop();frame=Math.max(0,frame-1);render();};$('next').onclick=()=>{stop();frame=Math.min(40,frame+1);render();};$('candidate').onchange=e=>{candidate=e.target.value;render();};for(const id of ['base-layer','obs-layer','follow'])$(id).onchange=render;$('fit').onclick=fit;
$('play').onclick=()=>{if(timer){stop();return;}if(frame===40)frame=0;$('play').textContent='暂停';timer=setInterval(()=>{frame++;if(frame>=40){frame=40;stop();}render();},500);};$('auto').onclick=()=>{if(timer){stop();return;}if(stage===5)stage=0;render();$('auto').textContent='暂停';timer=setInterval(()=>{stage++;if(stage>=5){stage=5;stop();}render();},3500);};
D.stages.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.stage=i;b.onclick=()=>{stop();stage=i;render();};$('steps').append(b);});cases.forEach((c,i)=>{const b=document.createElement('button');b.className='case';b.dataset.case=i;b.textContent=c;b.onclick=()=>{caseIndex=i;render();};$('cases').append(b);});
$('export').onclick=()=>{const value=mode==='real'?{data_kind:'actual_single_pass',frame:D.actual.replay[frame],map_updates:[],candidate_id:candidate}:D.stages[stage];const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=mode==='real'?'实际场景_当前帧.json':'受控模拟_当前阶段.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};window.addEventListener('resize',fit);render();
</script></body></html>
