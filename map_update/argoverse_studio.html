<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argoverse · Pipeline rerun</title><link rel="stylesheet" href="../assets/argoverse_studio.css?v=__REVISION__"></head>
<body><header class="mast"><a class="brand" id="main-link">AIE1903 <span>/ Argoverse</span></a><nav><a id="nuscenes-link" data-en="nuScenes results ↗" data-zh="nuScenes 结果 ↗"></a><a href="../result.json" download id="download" data-en="Download result" data-zh="下载运行结果"></a><a id="language-link"></a></nav></header>
<main><section class="heading"><div><p class="eyebrow" data-en="RECORDED DATA · EXECUTED PIPELINE" data-zh="已交付数据 · 实际管线重跑"></p><h1 data-en="Argoverse rerun, with every outcome visible." data-zh="Argoverse 已重跑，每一步都有结果。"></h1><p id="intro"></p></div><span class="complete" data-en="PROCESSING COMPLETE" data-zh="处理已完成"></span></section>
<section id="overview" class="overview" aria-label="Run totals"></section>
<div class="context" id="stage-context"></div>
<section class="workspace"><article class="panel map-panel"><div class="panel-head"><div><span class="eyebrow" data-en="SUPPLIED PRIOR MAP + RECORDED CANDIDATE" data-zh="提供的历史地图 + 实际候选几何"></span><h2 data-en="Where the pipeline found a difference" data-zh="管线在哪里发现了差异"></h2></div><button id="fit" data-en="Locate candidate" data-zh="定位候选"></button></div><div class="map-stage"><canvas id="map" aria-label="Argoverse prior map and candidate geometry"></canvas><div class="map-label" id="map-label"></div><div id="truth-watermark" hidden data-en="EVALUATION TRUTH OVERLAY" data-zh="仅供评估的真值叠加"></div><div class="map-actions"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit-all" data-en="Map" data-zh="全图"></button></div><div id="map-scale"></div></div><div class="legend"><span><i class="prior"></i><span data-en="Prior map" data-zh="历史地图"></span></span><span><i class="candidate"></i><span data-en="M4 observed representative" data-zh="M4 观测代表曲线"></span></span><span><i class="m3"></i><span data-en="M3 input candidates" data-zh="M3 输入候选"></span></span><span id="truth-legend" hidden><i class="truth"></i><span data-en="Current map · evaluation only" data-zh="当前真值图 · 仅评估"></span></span></div><p class="map-note" data-en="City coordinates, viewed in XY. These are supplied vector geometries; the candidate is an observed curve, not a reconstructed map edit." data-zh="城市坐标的 XY 视图。这里显示提供的矢量几何；候选为观测曲线，不是重建后的地图修改。"></p></article>
<aside class="panel verdict"><div class="panel-head"><h2 data-en="Automatic outcome" data-zh="自动处理结果"></h2><span class="dot"></span></div><div class="verdict-body"><span id="change-id" class="eyebrow"></span><h2 id="verdict"></h2><p id="verdict-note"></p><dl id="status"></dl><h3 data-en="Why this result?" data-zh="为什么得到这个结果？"></h3><ul id="reasons"></ul></div></aside></section>
<section class="panel pipeline"><div class="panel-head"><div><span class="eyebrow" data-en="FOLLOW THE ACTUAL DATA FLOW" data-zh="查看实际数据流"></span><h2 data-en="Three stages, different responsibilities" data-zh="三个阶段，各自负责什么"></h2></div></div><div id="stage-cards" class="stage-cards"></div><p id="m2-diagnostics" class="context" hidden></p><div class="stage-detail"><div><h3 data-en="M3 observation outcomes" data-zh="M3 逐观测结果"></h3><div id="m3-outcomes" class="outcome-totals"></div><p class="small" data-en="Counts below are reason occurrences. One observation can have several reasons; they do not sum to the observation total." data-zh="下表为原因出现次数；一个观测可以对应多个原因，不能相加作为观测总数。"></p><div id="m3-reasons"></div></div><div><h3 data-en="M4 evidence and configured thresholds" data-zh="M4 证据与配置阈值"></h3><div id="m4-evidence"></div><p id="duration-note" class="context"></p></div></div></section>
<section class="panel evaluation"><div class="panel-head"><div><span class="eyebrow" data-en="SEPARATE FROM PREDICTION" data-zh="与预测分开"></span><h2 data-en="Evaluate against the supplied current map" data-zh="用提供的当前真值图做评估"></h2></div><label class="toggle"><input type="checkbox" id="truth-toggle"><span data-en="Evaluation truth" data-zh="显示评估真值"></span></label></div><p id="evaluation-off" data-en="The current-map truth is hidden by default. Turn it on to inspect retrieval metrics and the evaluation-only map overlay. It does not change the prediction." data-zh="当前地图真值默认隐藏。开启后可查看检出指标及仅用于评估的地图叠加；它不改变预测结果。"></p><div id="evaluation-content" hidden><p class="evaluation-banner" data-en="EVALUATION ONLY · Current-map truth is a comparison target, not an input to M3/M4 decisions." data-zh="仅用于评估 · 当前地图真值用于对照，不作为 M3/M4 判定输入。"></p><div id="evaluation-metrics" class="overview"></div><p id="evaluation-scope"></p><div id="candidate-diagnostics"></div><p id="evaluation-limit" class="small"></p></div></section>
<details class="panel provenance"><summary data-en="Run identity & source hashes" data-zh="运行标识与来源哈希"></summary><dl id="run-info"></dl><div id="sources"></div></details>
</main><footer data-en="Recorded observations and source classes are preserved. Unknown fields are completed data-unavailable outcomes; no human review queue is created." data-zh="保留原始观测与来源类别。未知字段以数据不可得的结果结束处理，不生成待人工复核队列。"></footer>
<script type="application/json" id="result-data">__RESULT__</script><script src="../assets/argoverse_studio.js?v=__REVISION__"></script></body></html>
