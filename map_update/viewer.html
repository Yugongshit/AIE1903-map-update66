<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared Map Lab · 共享地图维护</title>
<style>
:root{color-scheme:dark;--bg:#0a111c;--panel:#111d2c;--line:#25354a;--muted:#94a6ba;--cyan:#5de4d1;--amber:#ffc56a;--pink:#ee83b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf1fa;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:25px 32px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:2px 0;font-weight:650}h2{font-size:15px;margin:0}p{margin:4px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan)}.muted{color:var(--muted)}.badge{padding:5px 12px;border:1px solid #78603a;border-radius:30px;color:var(--amber);font-size:12px}.intro{padding:13px 32px;background:#152131;color:#bbcbdd;font-size:13px}.layout{padding:22px 32px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:12px 16px}.stat strong{display:block;font-size:25px;font-weight:550}.stat span{color:var(--muted);font-size:12px}.panelhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.layers{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:12px 18px}.layers label{cursor:pointer}.layers input{accent-color:var(--cyan)}#map{height:490px;width:100%;display:block;background:radial-gradient(ellipse at center,#122a37,#0c1723);touch-action:none;cursor:grab}#map:active{cursor:grabbing}.timeline{padding:16px 18px}.timeline input{width:100%;accent-color:var(--cyan);margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}button,select{border:1px solid #375169;border-radius:6px;background:#192e41;color:#eaf1fa;padding:7px 11px;cursor:pointer;font:inherit;font-size:12px}button:hover{border-color:var(--cyan)}#events{max-height:310px;overflow:auto}.event{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}.event:hover,.event.selected{background:#1c3345}.event strong{font-size:13px}.status{font-size:11px;color:var(--amber)}.detail{padding:16px;font-size:12px;min-height:200px}.detail dt{color:var(--muted);margin-top:9px}.detail dd{margin:0;overflow-wrap:anywhere}.detail code{color:var(--cyan)}footer{padding:0 32px 22px;font-size:12px;color:var(--muted)}.spaced{margin-top:16px}.small{font-size:12px}#version{max-width:330px;overflow-wrap:anywhere;color:var(--cyan);font-size:12px}#record{overflow-wrap:anywhere}.empty{padding:18px;color:var(--muted)}a{color:var(--cyan)}@media(max-width:1000px){.layout{grid-template-columns:1fr;padding:16px}header{padding:18px}.intro{padding:12px 18px}#map{height:420px}.stats{gap:6px}.stat{padding:10px}.stat span{font-size:11px}footer{padding:16px}}
</style></head>
<body>
<header><div><div class="eyebrow">SHARED MAP LAB / RESEARCH PROTOTYPE</div><h1>共享道路地图维护</h1><p class="muted">证据积累 · 持续性判断 · 版本更新</p></div><span class="badge" id="dataset"></span></header>
<div class="intro">“长期”表示通过当前规则、可纳入基础地图的变化候选。证据分数不是概率；一次经过的连续帧不构成独立复访。</div>
<main class="layout"><section>
<div class="stats"><div class="stat"><strong id="n-events">0</strong><span>累计候选事件</span></div><div class="stat"><strong id="n-applied">0</strong><span>当前已写入事件</span></div><div class="stat"><strong id="n-temporary">0</strong><span>临时占用事件</span></div><div class="stat"><strong id="n-review">0</strong><span>待核实 / 证据不足</span></div></div>
<div class="panel"><div class="panelhead"><div><h2>局部地图 · 俯视对比</h2><div class="muted small" id="coordinate"></div></div><button id="fit">重置视图</button></div>
<div class="layers"><label style="color:#8b9cb2"><input type="checkbox" data-layer="prior" checked> 原始地图</label><label style="color:var(--cyan)"><input type="checkbox" data-layer="updated" checked> 当前版本</label><label style="color:var(--amber)"><input type="checkbox" data-layer="observed" checked> 观测 / 候选</label><label style="color:var(--pink)"><input type="checkbox" data-layer="temporary" checked> 临时事件</label></div>
<svg id="map" role="img" aria-label="City 坐标道路地图，原始、更新、观测和临时事件叠加"><g id="drawing"></g></svg>
<div class="timeline"><div class="row"><h2>证据时间线</h2><button id="play">播放</button></div><input id="time" type="range" min="0" value="0" aria-label="选择证据时刻"><div class="row small"><span id="time-label"></span><span id="record" class="muted"></span></div><div class="row small spaced"><span id="version"></span><button id="download">导出此版本 JSON</button></div></div></div>
</section><aside><div class="panel"><div class="panelhead"><h2>变化事件</h2><span class="muted small">点击查看证据</span></div><div id="events"></div></div><div class="panel spaced"><div class="panelhead"><h2>判定与来源</h2></div><div id="detail" class="detail"></div></div><div class="panel spaced"><div class="detail"><strong>规划接口边界</strong><p class="muted">基础地图与临时事件分别输出。过期表示需要刷新，不代表已恢复通行；本模块不生成封路或驾驶安全结论。</p><p class="muted" id="threshold"></p></div></div></aside></main>
<footer id="provenance"></footer>
<script id="bundle" type="application/json">__BUNDLE_JSON__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById('bundle').textContent), $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const labels={insufficient_evidence:'证据不足',temporary:'临时事件',long_term_candidate:'长期候选 · 写回受阻',applied:'已写入基础地图',resolved:'明确观测到恢复',review_required:'需要复核'};
const reasons={need_independent_revisits_and_time_span:'需要更多独立访问及足够时间跨度',temporary_layer_only_not_permanence_proof:'仅进入临时事件层；持续占用不证明永久变化',missing_reliability:'缺少成员 3 的可靠性结果',invalid_alignment:'坐标对齐无效',insufficient_coverage:'有效覆盖率不足',discrepancy_is_not_a_structural_change_type:'标线差异尚未明确为可执行的结构变化',missing_observed_line_geometry:'缺少可写回的观测折线',unstable_geometry_across_visits:'不同访问中的几何不稳定',long_term_rule_passed_not_permanence_guarantee:'通过当前跨访问与几何规则；不保证永久存在',explicit_prior_observed:'有充分覆盖下的明确恢复观测',target_changed_since_baseline:'目标要素已被其他更新修改，需重新核验'};
let index=Math.max(0,data.timeline.length-1), selected=null, timer=null, view=null, drag=null;
$('dataset').textContent=data.baseline.map_role==='controlled_synthetic_prior'?'受控合成演示 · 非真实评估':'研究数据 · 规则尚待校准';
$('coordinate').textContent=`${data.baseline.coordinate_reference.city_id} / City · 单位 m · 滚轮缩放 / 拖动平移`;
$('provenance').textContent=`来源：${data.baseline.provenance||'见输入记录 source 字段'}。原始纳秒时间戳以字符串保存。全部资源在本地，无在线底图。`;
$('threshold').textContent=`当前示例门槛：${data.policy.min_visits} 次独立访问，间隔 ≥ ${data.policy.min_visit_gap_s/3600} h，跨度 ≥ ${data.policy.min_span_s/3600} h。阈值尚未经真实数据校准。`;
$('time').max=Math.max(0,data.timeline.length-1);
function snapshot(){return data.timeline[index]||{timestamp_ns:data.as_of_ns,record_id:'无证据',version:data.baseline.version,events:[]};}
function currentMap(s){return data.versions.find(v=>v.version===s.version).map;}
function points(g){return !g?[]:g.type==='Polygon'?g.coordinates.flat():g.coordinates;}
function fit(){const all=[...data.baseline.elements.map(e=>e.geometry_city),...data.current_map.elements.map(e=>e.geometry_city),...data.events.map(e=>e.geometry_city)].flatMap(points);if(!all.length){view=[-10,-10,20,20];}else{const xs=all.map(p=>p[0]),ys=all.map(p=>-p[1]);const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;view=[x-6,y-6,Math.max(w+12,20),Math.max(h+12,20)];}setView();}
function setView(){$('map').setAttribute('viewBox',view.join(' '));}
function path(g,color,width,dash,fill=false){if(!g)return;const p=document.createElementNS(ns,'path');const rings=g.type==='Polygon'?g.coordinates:[g.coordinates];p.setAttribute('d',rings.map(r=>r.map((v,i)=>`${i?'L':'M'}${v[0]},${-v[1]}`).join(' ')+(g.type==='Polygon'?' Z':'')).join(' '));p.setAttribute('fill',fill?color:'none');p.setAttribute('fill-opacity','.16');p.setAttribute('stroke',color);p.setAttribute('stroke-width',width);p.setAttribute('vector-effect','non-scaling-stroke');if(dash)p.setAttribute('stroke-dasharray',dash);$('drawing').append(p);}
function enabled(name){return document.querySelector(`[data-layer="${name}"]`).checked;}
function draw(s){$('drawing').replaceChildren();if(enabled('prior'))data.baseline.elements.filter(e=>e.active).forEach(e=>path(e.geometry_city,'#8b9cb2',5,'7 5'));if(enabled('updated'))currentMap(s).elements.filter(e=>e.active).forEach(e=>path(e.geometry_city,'#5de4d1',2.5));for(const e of s.events){if(e.status==='resolved')continue;const temporary=e.change_type==='occupancy'||e.status==='temporary';if(enabled(temporary?'temporary':'observed'))path(e.geometry_city,temporary?'#ee83b5':'#ffc56a',e.event_id===selected?5:2,'4 4',temporary);}}
function detail(e){const root=$('detail');root.replaceChildren();if(!e){root.textContent='选择一条事件，查看支持访问、判定原因与原始证据。';return;}const dl=document.createElement('dl');const records=data.evidence.filter(r=>e.record_ids.includes(r.record_id));const values=[['事件 / 类型',`${e.event_id} / ${e.change_type}`],['判定',labels[e.status]||e.status],['原因',reasons[e.reason]||e.reason],['独立访问 / 支持时间跨度',`${e.independent_visits} 次 / ${(e.span_s/3600).toFixed(2)} h`],['目标地图要素',e.map_element_id||'无匹配要素'],['最新原始证据分数',records.at(-1)?.evidence_score??'未提供'],['证据记录',e.record_ids.join(', ')],['来源',[...new Set(records.map(r=>r.source))].join(', ')],['新鲜度',e.stale?'已过期，不能推断恢复':'时间线当前时刻'],['最近质量拒绝',e.last_rejected_reason||'无']];for(const [key,value]of values){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;dl.append(dt,dd);}root.append(dl);}
function render(){const s=snapshot();$('time').value=index;$('n-events').textContent=s.events.length;$('n-applied').textContent=s.events.filter(e=>e.status==='applied').length;$('n-temporary').textContent=s.events.filter(e=>e.status==='temporary').length;$('n-review').textContent=s.events.filter(e=>['insufficient_evidence','long_term_candidate','review_required'].includes(e.status)).length;$('time-label').textContent=new Date(Number(BigInt(s.timestamp_ns)/1000000n)).toISOString().replace('T',' ').replace('.000Z',' UTC');$('record').textContent=`${index+1} / ${data.timeline.length} · ${s.record_id}`;$('version').textContent=`版本 ${s.version}`;if(!s.events.some(e=>e.event_id===selected))selected=s.events[0]?.event_id||null;const root=$('events');root.replaceChildren();for(const e of s.events){const row=document.createElement('div');row.className='event'+(e.event_id===selected?' selected':'');row.tabIndex=0;row.setAttribute('role','button');const title=document.createElement('strong'),status=document.createElement('div'),sub=document.createElement('div');title.textContent=`${e.event_id} · ${e.change_type}`;status.className='status';status.textContent=labels[e.status]||e.status;sub.className='small muted';sub.textContent=`${e.independent_visits} 次访问 · ${(e.span_s/3600).toFixed(1)} h${e.stale?' · 过期':''}`;row.append(title,status,sub);row.onclick=()=>{selected=e.event_id;render();};row.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();row.click();}};root.append(row);}if(!s.events.length)root.textContent='暂无证据';detail(s.events.find(e=>e.event_id===selected));draw(s);}
$('time').oninput=e=>{index=+e.target.value;render();};document.querySelectorAll('[data-layer]').forEach(x=>x.onchange=()=>draw(snapshot()));$('fit').onclick=fit;
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放';return;}if(index>=data.timeline.length-1)index=0;render();$('play').textContent='暂停';timer=setInterval(()=>{if(index>=data.timeline.length-1){clearInterval(timer);timer=null;$('play').textContent='播放';return;}index++;render();},850);};
$('download').onclick=()=>{const map=currentMap(snapshot()),url=URL.createObjectURL(new Blob([JSON.stringify(map,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='map-'+map.version+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function svgPoint(e){const p=new DOMPoint(e.clientX,e.clientY);return p.matrixTransform($('map').getScreenCTM().inverse());}
$('map').addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e),factor=e.deltaY>0?1.12:.89;if(view[2]*factor<1||view[2]*factor>100000)return;view=[p.x+(view[0]-p.x)*factor,p.y+(view[1]-p.y)*factor,view[2]*factor,view[3]*factor];setView();},{passive:false});
$('map').onpointerdown=e=>{drag={p:svgPoint(e),view:[...view]};$('map').setPointerCapture(e.pointerId);};$('map').onpointermove=e=>{if(!drag)return;const p=svgPoint(e);view[0]+=drag.p.x-p.x;view[1]+=drag.p.y-p.y;setView();};$('map').onpointerup=$('map').onpointercancel=()=>{drag=null;};fit();render();
</script></body></html>
