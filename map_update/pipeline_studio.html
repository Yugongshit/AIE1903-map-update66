<article class="panel routing"><div class="panel-head"><div><span class="eyebrow" data-en="SAME EVENT · TRACEABLE SEMANTIC EVIDENCE" data-zh="同一事件 · 可追溯的语义证据"></span><h2 data-en="Why this layer?" data-zh="为什么属于这个图层？"></h2></div><span id="routing-status" class="tag"></span></div><div id="routing-path" class="routing-path"></div><div id="layer-reasons" class="routing-reasons"></div><details class="matched-evidence"><summary data-en="Inspect the matched source facts" data-zh="查看匹配到的来源事实"></summary><div id="matched-evidence"></div></details><div id="lifecycle" class="lifecycle" hidden></div></article>
<article class="panel structural-evidence" id="structural-evidence" hidden><div class="panel-head"><h3 data-en="Recorded measurements behind the completed decision" data-zh="最终判定所依据的原始测量"></h3></div><div class="structural-evidence-body"><p id="structural-hypothesis-note"></p><dl id="structural-hypothesis-values"></dl><div id="observation-dimensions"></div><p class="note" data-en="Measured relations remain available even when the downstream observation is unknown. Engineering weight fractions are not calibrated probabilities." data-zh="即使下游观测判断为 unknown，测得的几何关系仍予以保留；工程权重占比不是校准概率。"></p><div id="same-window-evidence" hidden></div><div id="structural-required-evidence-box" hidden><h3 data-en="Edit checks not established by the supplied record" data-zh="交付记录未满足的修改检查"></h3><ul id="structural-required-evidence"></ul></div><details id="local-measurements" hidden><summary data-en="Inspect recorded local measurements" data-zh="查看记录的局部测量"></summary><div id="local-measurement-rows"></div></details><details><summary data-en="Original hypothesis and evidence fields" data-zh="原始假设与证据字段"></summary><pre id="structural-audit-source"></pre></details></div></article>
<div class="evidence-grid"><article class="panel evidence"><h3 data-en="Observation evidence" data-zh="观测依据"></h3><ul id="reliability-reasons"></ul><div id="geometry-box"><svg id="geometry" viewBox="0 0 360 150" role="img" aria-label="Source event geometry in city XY coordinates"></svg><p data-en="Supplied event geometry, XY view. No replacement map geometry is inferred." data-zh="提供的事件几何，按 XY 显示；这里没有推断替代地图几何。"></p></div></article><article class="panel evidence"><h3 data-en="Structural edit conditions" data-zh="结构修改条件"></h3><ul id="write-reasons"></ul><div id="edit-contract" hidden><dl id="edit-contract-values"></dl><p id="edit-contract-note"></p><p id="edit-target-note"></p><details><summary data-en="Requirements for this operation" data-zh="此操作对应的条件"></summary><ul id="edit-contract-requirements"></ul></details></div><p class="note" data-en="Layer identity determines the kind of map information. Structural edit requirements depend on the operation: geometry, marking attributes and deletion have separate contracts." data-zh="图层身份决定地图信息的类型。结构修改条件随操作而定，几何、标线属性和删除分别检查。"></p></article></div></div></section>
<section class="panel methods"><div class="panel-head"><div><span class="eyebrow" data-en="WHAT ACTUALLY RUNS" data-zh="实际执行了什么"></span><h2 data-en="The connected method, step by step" data-zh="接通后的方法，逐步说明"></h2></div></div><div class="method-grid"><article><span class="step">01</span><h3 data-en="Check the observed evidence" data-zh="检查观测证据"></h3><p data-en="Argoverse references with identical geometry and marking attributes share a physical identity. Fixed-position signed residuals, median/MAD and quality-weighted observations assess local geometry. nuScenes occupancy uses supplied annotated footprints and recorded lane overlap. Its marking curves are matched to clipped local references within their exact candidate windows; geometric references are distinct from verified edit targets." data-zh="Argoverse 中几何与标线属性相同的参考边界归为同一物理对象。使用固定位置的带符号残差、中位数／MAD 和观测质量权重评估局部几何。nuScenes 占用采用提供的标注轮廓和车道重叠记录；标线曲线在各自候选窗口内匹配裁剪后的局部参考，几何比较参考与已核验修改对象分开。"></p><p class="note" data-en="Stable residuals alone cannot verify global alignment or prove that a curb is a painted marking." data-zh="稳定残差本身不能证明全局对齐正确，也不能证明路缘就是标线。"></p></article><article><span class="step">02</span><h3 data-en="Classify semantics, then test materiality" data-zh="语义分层，再判断是否实质变化"></h3><p data-en="A changed road layout, lane geometry, new road or building is a base-map structure claim. A car, congestion, barrier, construction closure or landslide obstruction is a map-state event claim. Mixed claims remain explicit so a blockage does not silently become a structural edit." data-zh="道路布局、车道几何、新道路或建筑变化属于基础图结构主张；车辆、拥堵、路障、施工封闭或滑坡阻断属于地图状态事件主张。混合主张需要明确区分，不能把阻断直接当成结构修改。"></p><p id="materiality-method" class="note" data-en="Geometry-only changes require a known edit target and operation, plus displacement greater than 0.5 m along a continuous segment of at least 3 m. Verified additions, deletions, connectivity, lane use and marking meaning are checked as discrete changes. These are engineering settings, not learned accuracy guarantees." data-zh="纯几何变化需要明确修改对象和操作，且连续至少 3 米区间的位移超过 0.5 米。已确定的新增、删除、连接关系、车道用途和标线含义变化另按离散变化检查。这些是工程设定，不是学习得到的准确率保证。"></p></article><article><span class="step">03</span><h3 data-en="Store the result in its layer" data-zh="分层存储结果"></h3><p data-en="Store state events with their geometry and lifecycle. Apply executable material structural edits to a separate map copy. Otherwise complete the candidate with no map update using the supplied recording; no revisit or review queue is created." data-zh="将状态事件的几何与生命周期存入状态层，将可执行的实质结构修改应用到独立地图副本。其余候选依据交付记录完成不改图判断，不建立再次采集或复核队列。"></p><p class="note" data-en="Automatic expiry marks a state record as stale or expired. It does not prove that the obstacle cleared or the road recovered." data-zh="自动到期表示状态记录已陈旧或过期，不证明障碍已经解除或道路已经恢复。"></p></article></div><div id="parameters" class="parameters"></div></section>
