<header class="mast"><a id="home-link" class="brand">AIE1903 <span>/ MAP-LAYER PIPELINE</span></a><nav><a id="source-link" data-en="Recorded-data view ↗" data-zh="观测记录页面 ↗"></a><a href="../result.json" id="download" download data-en="Download executed result" data-zh="下载实际运行结果"></a><a id="language-link"></a></nav></header>
<main><section class="heading"><div><p class="eyebrow" data-en="STRUCTURE / STATE · EXECUTED CLASSIFICATION" data-zh="结构 / 状态 · 已实际执行分类"></p><h1 data-en="Identify the change. Choose its map layer." data-zh="识别变化，确定它属于哪个地图图层。"></h1><p data-en="Road geometry and layout belong to the base map. Occupancy, traffic and operational restrictions belong to the attached state layer. Observation reliability and permission to write remain separate decisions." data-zh="道路几何与布局属于基础图；占用、交通状况与通行限制属于附加状态层。观测可靠性和写入资格分别判断。"></p></div><label class="dataset-control"><span data-en="Dataset" data-zh="数据集"></span><select id="dataset"><option value="nuscenes">nuScenes</option><option value="argoverse">Argoverse</option></select></label></section>
<div class="model-boundary" id="model-boundary" data-en="The class describes what changed and where it belongs. Duration does not determine the map layer. This implementation matches explicit semantic evidence; it does not claim trained or calibrated classification probabilities." data-zh="类别描述变化对象及其所属图层，持续时长不决定图层。本版依据明确的语义证据匹配，不声称已训练或得到校准分类概率。"></div>
<section id="overview" class="overview"></section>
<section class="panel composite-panel"><div class="panel-head"><div><span class="eyebrow" data-en="COMPOSITE MAP · SHARED CITY COORDINATES" data-zh="复合地图 · 同一城市坐标系"></span><h2 data-en="Base map + structural candidates + state events" data-zh="基础地图 + 结构候选变化 + 状态事件"></h2></div><span id="map-source-status" class="tag"></span></div><div class="composite-tools"><div class="map-layer-controls"><label><input id="map-layer-base" type="checkbox" checked><i class="base-key"></i><span data-en="Base map" data-zh="基础图"></span></label><label><input id="map-layer-state" type="checkbox" checked><i class="state-key"></i><span data-en="State events" data-zh="状态事件"></span></label><label><input id="map-layer-structure" type="checkbox" checked><i class="structure-key"></i><span data-en="Structural candidates" data-zh="结构候选"></span></label></div><label class="map-scope"><span data-en="Structural candidates" data-zh="结构候选范围"></span><select id="map-structure-scope"><option value="supported" data-en="Supported only" data-zh="仅观测支持"></option><option value="all" data-en="All hypotheses" data-zh="全部假设"></option></select></label><div class="map-fit-controls"><button id="map-fit-all" data-en="Fit full map" data-zh="查看完整地图"></button><button id="map-fit-selected" data-en="Focus selected event" data-zh="定位选中事件"></button></div></div><div class="composite-stage"><canvas id="composite-map" aria-label="Composite map of supplied base geometry, red state events and yellow structural candidates"></canvas><div id="map-selected" class="composite-selected"></div><div class="composite-axis">↑ +Y</div><div class="composite-scale"><span id="map-scale-value"></span><i id="map-scale-line"></i></div><div class="composite-zoom"><button id="map-zoom-in" aria-label="Zoom in">+</button><button id="map-zoom-out" aria-label="Zoom out">−</button></div></div><div class="composite-legend" id="map-legend"><span><i class="base-key"></i><span data-en="Muted: supplied prior geometry" data-zh="灰色：提供的历史地图几何"></span></span><span><i class="state-key"></i><span data-en="Red: stored state footprints" data-zh="红色：已存储状态轮廓"></span></span><span><i class="structure-key dashed"></i><span data-en="Yellow dashed: structural candidates, not applied edits" data-zh="黄色虚线：结构候选，不代表已写入"></span></span></div><div class="composite-footer"><p id="map-status"></p><p id="map-note"></p></div></section>
<details class="panel perception-guide" id="perception-guide" hidden><summary data-en="Perception guide · which labels are actually supplied?" data-zh="感知说明 · 实际提供了哪些类别？"></summary><div id="perception-guide-content"></div></details>

<section class="panel comparison"><div class="panel-head"><div><span class="eyebrow" data-en="EXECUTED OUTPUTS · DECLARED EVALUATION SCOPE" data-zh="实际输出 · 明确的评估范围"></span><h2 data-en="What this pipeline produced" data-zh="本次管线实际输出了什么"></h2></div><span id="dataset-scope" class="tag"></span></div><div id="comparison"></div></section>
<section class="workspace"><aside class="panel event-panel"><div class="panel-head"><h2 data-en="Events" data-zh="事件"></h2><span id="event-count" class="tag"></span></div><div class="event-controls"><input id="search" type="search" aria-label="Search events" placeholder="Search event / map ID"><select id="filter" aria-label="Filter events"><option value="all" data-en="All outcomes" data-zh="全部结果"></option><option value="map_state_event" data-en="Map-state event" data-zh="地图状态事件"></option><option value="base_map_structure" data-en="Base-map structure" data-zh="基础图结构"></option><option value="unresolved" data-en="Unresolved layer identity" data-zh="图层身份未确定"></option><option value="not_applicable" data-en="No observed change class" data-zh="无观测变化类别"></option><option value="insufficient" data-en="Limited geometry evidence" data-zh="几何证据不足"></option></select></div><div id="events"></div></aside>
<div class="event-detail"><div class="selected-heading"><span id="selected-id" class="eyebrow"></span><h2 id="selected-title"></h2></div><div id="selected-evaluation" class="selected-evaluation"></div><div class="result-cards"><article class="panel result-card"><span class="eyebrow" data-en="01 / OBSERVATION RELIABILITY" data-zh="01 / 观测可靠性"></span><h3 id="reliability-status"></h3><p id="reliability-note"></p><dl id="reliability-values"></dl></article><article class="panel result-card"><span class="eyebrow" data-en="02 / MAP-LAYER IDENTITY" data-zh="02 / 所属地图图层"></span><h3 id="layer-status"></h3><p id="layer-note"></p><dl id="layer-values"></dl></article><article class="panel result-card"><span class="eyebrow" data-en="03 / STORAGE & QUALITY GATE" data-zh="03 / 存储与质量条件"></span><h3 id="write-status"></h3><p id="write-note"></p><dl id="write-values"></dl></article></div>
<article class="panel routing"><div class="panel-head"><div><span class="eyebrow" data-en="SAME EVENT · TRACEABLE SEMANTIC EVIDENCE" data-zh="同一事件 · 可追溯的语义证据"></span><h2 data-en="Why this layer?" data-zh="为什么属于这个图层？"></h2></div><span id="routing-status" class="tag"></span></div><div id="routing-path" class="routing-path"></div><div id="layer-reasons" class="routing-reasons"></div><details class="matched-evidence"><summary data-en="Inspect the matched source facts" data-zh="查看匹配到的来源事实"></summary><div id="matched-evidence"></div></details><div id="lifecycle" class="lifecycle" hidden></div></article>
<div class="evidence-grid"><article class="panel evidence"><h3 data-en="Observation evidence" data-zh="观测依据"></h3><ul id="reliability-reasons"></ul><div id="geometry-box"><svg id="geometry" viewBox="0 0 360 150" role="img" aria-label="Source event geometry in city XY coordinates"></svg><p data-en="Supplied event geometry, XY view. No replacement map geometry is inferred." data-zh="提供的事件几何，按 XY 显示；这里没有推断替代地图几何。"></p></div></article><article class="panel evidence"><h3 data-en="Structural edit conditions" data-zh="结构修改条件"></h3><ul id="write-reasons"></ul><p class="note" data-en="Layer identity determines the kind of map information. A structural patch still requires a supported change, a verified target, alignment and complete edit geometry." data-zh="图层身份决定地图信息的类型。结构补丁仍需要有依据的变化、已核验对象、对齐及完整修改几何。"></p></article></div></div></section>
<section class="panel methods"><div class="panel-head"><div><span class="eyebrow" data-en="WHAT ACTUALLY RUNS" data-zh="实际执行了什么"></span><h2 data-en="The connected method, step by step" data-zh="接通后的方法，逐步说明"></h2></div></div><div class="method-grid"><article><span class="step">01</span><h3 data-en="Check the observed evidence" data-zh="检查观测证据"></h3><p data-en="Argoverse references with identical geometry and marking attributes share a physical identity. Fixed-position signed residuals, median/MAD and quality-weighted observations assess local geometry. nuScenes occupancy uses supplied annotated footprints and recorded lane overlap." data-zh="Argoverse 中几何与标线属性相同的参考边界归为同一物理对象。使用固定位置的带符号残差、中位数／MAD 和观测质量权重评估局部几何。nuScenes 占用采用提供的标注轮廓和车道重叠记录。"></p><p class="note" data-en="Stable residuals alone cannot verify global alignment or prove that a curb is a painted marking." data-zh="稳定残差本身不能证明全局对齐正确，也不能证明路缘就是标线。"></p></article><article><span class="step">02</span><h3 data-en="Classify the change semantics" data-zh="按变化语义分类"></h3><p data-en="A changed road layout, lane geometry, new road or building is a base-map structure claim. A car, congestion, barrier, construction closure or landslide obstruction is a map-state event claim. Mixed claims remain explicit so a blockage does not silently become a structural edit." data-zh="道路布局、车道几何、新道路或建筑变化属于基础图结构主张；车辆、拥堵、路障、施工封闭或滑坡阻断属于地图状态事件主张。混合主张需要明确区分，不能把阻断直接当成结构修改。"></p><p class="note" data-en="A long-lasting closure can remain a state event; duration is not the classification criterion." data-zh="持续很久的封闭仍可以是状态事件；持续时长不是分类标准。"></p></article><article><span class="step">03</span><h3 data-en="Store the result in its layer" data-zh="分层存储结果"></h3><p data-en="State events attach their geometry, provenance and lifecycle to the map without replacing the underlying road structure. Structural changes pass their own evidence and edit-quality checks before a base-map patch can be applied." data-zh="状态事件将几何、来源与生命周期附着于地图，不替换底层道路结构。结构变化通过独立的证据与修改质量检查后，才可写入基础图补丁。"></p><p class="note" data-en="Automatic expiry marks a state record as stale or expired. It does not prove that the obstacle cleared or the road recovered." data-zh="自动到期表示状态记录已陈旧或过期，不证明障碍已经解除或道路已经恢复。"></p></article></div><div id="parameters" class="parameters"></div></section>
<details class="panel evaluation" id="evaluation-panel"><summary data-en="Evaluation & denominators · labels read after prediction" data-zh="评估与分母 · 预测完成后读取标签"></summary><div id="evaluation"></div></details>
<details class="panel provenance"><summary data-en="Run provenance & prediction freeze" data-zh="运行来源与预测冻结记录"></summary><div id="provenance"></div></details></main>
<footer data-en="The browser only presents saved pipeline outputs. Switching datasets or filters does not rerun a classifier or change observations. Expired records are not evidence of recovery." data-zh="浏览器仅展示保存的管线输出。切换数据集或筛选条件不会重跑分类器或改变观测；记录过期不构成恢复证据。"></footer><script type="application/json" id="pipeline-data">__RESULT__</script><script src="../assets/pipeline_studio.js?v=__REVISION__"></script></body></html>
